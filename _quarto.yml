project:
  type: website
  output-dir: _site

website:
  # title: "Shelby Level"
  favicon: inst/logos/sl-hex-sticker.png
  navbar:
    logo: inst/logos/sl.png # placeholder to be replaced by animated SVG logo
    right:
      - href: index.qmd
        text: "About Me"

      - href: blog.qmd
        text: Blog
      - href: projects.qmd
        text: "Past Projects"
      - icon: github
        href: https://github.com/shelbylevel
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/shelby-level/
        aria-label: LinkedIn
  page-footer:
    background: light # or dark
    left:
      - "Copyright 2024, Shelby Level"
    right:
      - icon: github
        href: https://github.com/shelbylevel
      - icon: linkedin
        href: https://www.linkedin.com/in/shelby-level/
  google-analytics: "G-S8RJYVFCYL"
  #reader-mode: true

format:
  html:
    theme: [lux, css/sl-styles.scss]
    include-in-header:
      - _extensions/shelbylevel/brand/logo-header.html
    toc: true
    page-layout: full

editor: source
execute:
  freeze: auto

