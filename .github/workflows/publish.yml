name: Render and Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      RENV_PATHS_CACHE: ${{ runner.temp }}/renv-cache
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
          tinytex: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::renv

      # Restore project library from renv.lock
      - name: Restore renv
        shell: Rscript {0}
        run: renv::restore(prompt = FALSE)

      # RSocrata was archived from CRAN; install from GitHub
      - name: Install RSocrata
        shell: Rscript {0}
        run: remotes::install_github("Chicago/RSocrata")

      - name: Render site
        run: quarto render

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=_site --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
